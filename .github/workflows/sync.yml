name: Sheets → Supabase Sync

on:
  schedule:
    # Monday at 6:00 AM IST (00:30 UTC) — full data sync after weekend
    - cron: '30 0 * * 1'
    # Thursday at 6:00 AM IST (00:30 UTC) — mid-week keep-alive + sync
    - cron: '30 0 * * 4'
  workflow_dispatch:  # Allow manual trigger from GitHub UI at any time

jobs:
  sync:
    runs-on: ubuntu-latest

    # ── Timeout ───────────────────────────────────────────────────────────────
    # 10 facilities x ~3 min each + mapping sheet + buffer = ~45 min max
    # Previous runs completed in ~7 min but Google Sheets API can be slow
    # under rate limits. 60 min gives headroom without wasting Action minutes.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            gspread \
            google-auth \
            pandas \
            sqlalchemy \
            psycopg2-binary \
            openpyxl \
            tenacity

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python sync_to_supabase.py
